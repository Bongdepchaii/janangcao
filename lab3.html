        let sinhvien_3 = new StudentPoly(
  "Nguyen Van A",

function Student(name, age, address, phone, birthday, subjects) {
  this.name = name;
  this.age = age;
  this.address = address;
  this.phone = phone;
  this.birthday = birthday;
  this.subjects = subjects;

  this.getInfo = function () {
    return `
      Name: ${this.name}<br>
      Age: ${this.age}<br>
      Address: ${this.address}<br>
      Phone: ${this.phone}<br>
      Birthday: ${this.birthday}<br>
    `;
  };
}


function StudentPoly(name, age, address, phone, birthday, subjects, polyClass) {
  Student.call(this, name, age, address, phone, birthday, subjects);

  this.polyClass = polyClass;

  this.showAll = function () {
    let subList = this.subjects
      .map((s) => `<li>${s.name} - ${s.teacher} - ${s.point} diem (${s.year})</li>`)
      .join("");

    return (
      this.getInfo() + `Class: ${this.polyClass}<br>Subjects:<ul>${subList}</ul>`
    );
  };
}
document.getElementById("bai3_info").innerHTML = sinhvien_3.showAll();

// Bai 4

function Person(name, age, address) {
  this.name = name;
  this.age = age;
  this.address = address;
}

Person.prototype.showProfile = function () {
  return `Name: ${this.name}<br>Age: ${this.age}<br>Address: ${this.address}<br><br>`;
};

function show() {
  let n1 = document.getElementById("p1_name").value;
  let a1 = document.getElementById("p1_age").value;
  let ad1 = document.getElementById("p1_address").value;

  let n2 = document.getElementById("p2_name").value;
  let a2 = document.getElementById("p2_age").value;
  let ad2 = document.getElementById("p2_address").value;

  if (!n1 || !a1 || !ad1 || !n2 || !a2 || !ad2) {
    alert("Nhap day du thong tin!");
    return;
  }

  let FirstPerson = new Person(n1, a1, ad1);
  let SecondPerson = new Person(n2, a2, ad2);


  document.getElementById("result").innerHTML = FirstPerson.showProfile() + SecondPerson.showProfile();
}
