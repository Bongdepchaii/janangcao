<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            justify-content: center;
            text-align: center;
            background-color: pink;
        }
        .lab-exercise {
            padding: 20px;
        }
        input[type="text"], input[type="number"] {
            padding: 8px;
            margin: 5px 0 10px;
        }
    </style>
</head>
<body>


    <div class="lab-exercise">
        <h2>Bai 1</h2>
        <div>
            <label for="b1_string">String:</label>
            <input type="text" id="b1_string" value="FPTPoly">
        </div>
        <button id="b1_button">Count</button>
        <div id="b1_result" style="margin-top: 10px;">
            <h3>7</h3>
        </div>
    </div>

    <div class="lab-exercise">
        <h2>Bai 2</h2>
        <div>
            <label for="b2_string">String:</label>
            <input type="text" id="b2_string" value="FPTPoly">
        </div>
        <div>
            <label for="b2_number">Number:</label>
            <input type="number" id="b2_number" value="3" min="1">
        </div>
        <button id="b2_button">Check</button>
        <div id="b2_result" style="margin-top: 10px;">
            <h3>FPT...</h3>
        </div>
    </div>

    <div class="lab-exercise">
        <h2>Bai 3</h2>
        <div>
            <label for="b3_string">String:</label>
            <input type="text" id="b3_string" value="javascript .... /// nang,,, cao">
        </div>
        <button id="b3_button">Check</button>
        <div id="b3_result" style="margin-top: 10px;">
            <h3>javascriptNangCao</h3>
        </div>
    </div>

    <div class="lab-exercise">
        <h2>Bai 4</h2>
        <div>
            <label for="b4_email">Email:</label>
            <input type="text" id="b4_email" value="nva@fpt.edu.vn">
        </div>
        <button id="b4_button">Check</button>
        <div id="b4_result" style="margin-top: 10px;">
            <h3>TRUE</h3>
        </div>
    </div>

    <script>
        // Bai 1
        document.getElementById("b1_button").onclick = function() {
            let str = document.getElementById("b1_string").value;
            let length = str.length;
            document.getElementById("b1_result").innerHTML = `<h3>${length}</h3>`;
        };

        // Bai 2
        document.getElementById("b2_button").onclick = function() {
            let str = document.getElementById("b2_string").value;
            let num = parseInt(document.getElementById("b2_number").value);
            
            let result = "";
            if (str.length > num) {
                result = str.substring(0, num) + "...";
            } else {
                result = str;
            }
            document.getElementById("b2_result").innerHTML = `<h3>${result}</h3>`;
        };

        // Bai 3
        document.getElementById("b3_button").onclick = function() {
            let str = document.getElementById("b3_string").value;
            
            let result = str.toLowerCase();
            
            result = result.replace(/\W+(.)/g, (match, char) => {
                return char.toUpperCase();
            });
            
            document.getElementById("b3_result").innerHTML = `<h3>${result}</h3>`;
        };
        document.getElementById("b3_button").click();

        // Bai 4
        document.getElementById("b4_button").onclick = function() {
            let email = document.getElementById("b4_email").value;

            const emailRegex = /^[a-z][a-z0-9_\.]{2,31}@[a-z0-9]{2,}(\.[a-z0-9]{2,4}){1,2}$/;

            let isValid = emailRegex.test(email.toLowerCase());
            
            // Hide true or flase
            document.getElementById("b4_result").innerHTML = `<h3>${isValid ? 'TRUE' : 'FALSE'}</h3>`;
        };

    </script>
</body>
</html>
